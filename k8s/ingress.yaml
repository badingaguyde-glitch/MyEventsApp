apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bantu-ingress
  namespace: bantu-production
  annotations:
    # Indique à Kubernetes d'utiliser Traefik (intégré d'office dans k3s)
    kubernetes.io/ingress.class: traefik
spec:
  tls:
    - hosts:
        - 138-68-145-245.nip.io
      secretName: bantu-tls
  rules:
    - host: 138-68-145-245.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 5000
