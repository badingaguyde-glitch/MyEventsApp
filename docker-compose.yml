services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ./Backend/.env
    environment:
      - RABBITMQ_URL=amqp://rabbitmq
      - REDIS_URL=redis://redis:6379
    restart: always
    depends_on:
      - redis
      - rabbitmq
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672" #Port RabbitMQ send/receive messages
      - "15672:15672" #Port RabbitMQ management interface

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always

  init-shared:
    image: alpine:latest
    volumes:
      - shared-data:/shared
    command: rm -f /shared/api-url.txt /shared/ssh.log

  mobilfrontend:
    build:
      context: ./MobilFrontend
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    volumes:
      - shared-data:/shared
    command:
      - sh
      - -c
      - |
        if [ -z "$$EXPO_PUBLIC_API_URL" ]; then
          echo "Waiting for API URL..."
          while [ ! -f /shared/api-url.txt ]; do sleep 1; done
          export EXPO_PUBLIC_API_URL=$$(cat /shared/api-url.txt)/api
        fi
        echo "Using API URL: $$EXPO_PUBLIC_API_URL"
        npx expo start --tunnel
    depends_on:
      backend:
        condition: service_started
      init-shared:
        condition: service_completed_successfully
    restart: always
    tty: true
    stdin_open: true

  backend-tunnel:
    image: alpine:latest
    volumes:
      - shared-data:/shared
    command:
      - sh
      - -c
      - |
        apk add --no-cache openssh-client
        mkdir -p /root/.ssh
        [ ! -f /root/.ssh/id_ed25519 ] && ssh-keygen -t ed25519 -N "" -f /root/.ssh/id_ed25519 || true
        ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -R 80:backend:5000 nokey@localhost.run > /shared/ssh.log 2>&1 &
        echo "Waiting for tunnel URL..."
        while ! grep -qE "https://[a-zA-Z0-9.-]+\.lhr\.life" /shared/ssh.log; do sleep 1; done
        grep -oE "https://[a-zA-Z0-9.-]+\.lhr\.life" /shared/ssh.log | head -n 1 > /shared/api-url.txt
        echo "Tunnel URL saved: $$(cat /shared/api-url.txt)"
        wait
    depends_on:
      backend:
        condition: service_started
      init-shared:
        condition: service_completed_successfully
    restart: always

volumes:
  shared-data:

