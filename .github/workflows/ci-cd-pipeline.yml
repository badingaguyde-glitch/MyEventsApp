name: "BANTU CI/CD Pipeline"

on:
  push:
    branches:
      - main
      - production
  pull_request:
    branches:
      - main
      - production

permissions:
  contents: read
  packages: write

jobs:
  # ___ Etape 1: Test Automatiés (CI) _______________
  build-and-test:
    name: Build & Test (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Test Backend
        run: |
          cd Backend
          npm ci
          npm test

      - name: Test Frontend
        run: |
          cd Frontend
          npm ci
          npm test

      - name: Test MobilFrontend
        run: |
          cd MobilFrontend
          npm ci
          npm test

  # __ Etape 2 : Build & Push Docker Vers GHCR (CD)_____
  deploy-docker:
    name: Build & Push to GHCR (CD)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' # Ne construit les images que lors d'un vrai push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker requiert des noms d'images en minuscules
      - name: Convert repository name to lowercase
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # 1. Build & Push Backend Image
      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/backend:latest
            ghcr.io/${{ env.REPO_LOWER }}/backend:${{ github.sha }}

      # 2. Build and push Frontend Image
      - name: Build and push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/frontend:latest
            ghcr.io/${{ env.REPO_LOWER }}/frontend:${{ github.sha }}

      # 3 Build and push Image Mobile (EXPO)
      - name: Build and push MobilFrontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./MobilFrontend
          file: ./MobilFrontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/mobilfrontend:latest
            ghcr.io/${{ env.REPO_LOWER }}/mobilfrontend:${{ github.sha }}