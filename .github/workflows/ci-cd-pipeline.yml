name: "ci/cd pipeline"

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and Test Backend
        run: |
          cd Backend
          npm ci
          npm test

      - name: Install and Test Frontend
        run: |
          cd Frontend
          npm ci
          npm test

      - name: Install and Test MobilFrontend
        run: |
          cd MobilFrontend
          npm ci
          npm test

  deploy-docker:
    name: Build and Push Docker Images (CD)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/myeventsapp-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/myeventsapp-backend:${{ github.sha }}

      - name: Build and push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/myeventsapp-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/myeventsapp-frontend:${{ github.sha }}

      - name: Build and push MobilFrontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./MobilFrontend
          file: ./MobilFrontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/myeventsapp-mobilfrontend:latest
            ${{ secrets.DOCKER_USERNAME }}/myeventsapp-mobilfrontend:${{ github.sha }}
